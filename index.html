<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Falling Sand</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="fallingsand.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090d12;
        --panel: rgba(13, 18, 27, 0.88);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #f3f5f7;
        --muted: #a7b0bd;
        --accent: #ffb347;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 179, 71, 0.18), transparent 30%),
          linear-gradient(180deg, #101720 0%, var(--bg) 55%);
        color: var(--text);
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      }

      .panel {
        padding: 24px;
        background: var(--panel);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border-right: 1px solid var(--panel-border);
      }

      .panel h1 {
        margin: 0 0 10px;
        font-size: 2rem;
        line-height: 1;
      }

      .panel p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }

      .control-group {
        display: grid;
        gap: 10px;
        margin-bottom: 20px;
      }

      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.95rem;
      }

      .value {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: #1e2937;
        color: var(--text);
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        background: #2d3a4d;
      }

      button.primary {
        background: var(--accent);
        color: #1d1306;
      }

      .canvas-stage {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      #canvas-host {
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      canvas {
        display: block;
      }

      @media (max-width: 900px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .panel {
          border-right: 0;
          border-bottom: 1px solid var(--panel-border);
        }

        .canvas-stage {
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel">
        <h1>Falling Sand</h1>
        <p>Paint sand with the mouse, tune how wide the brush is, and change how quickly the particles accelerate.</p>

        <section class="control-group" aria-labelledby="brush-size-label">
          <div class="control-row">
            <label for="brush-size" id="brush-size-label">Max Stream Width</label>
            <span class="value" id="brush-size-value">5</span>
          </div>
          <input id="brush-size" type="range" min="1" max="11" step="2" value="5" />
        </section>

        <section class="control-group" aria-labelledby="stream-growth-label">
          <div class="control-row">
            <label for="stream-growth" id="stream-growth-label">Widen Every</label>
            <span class="value" id="stream-growth-value">6f</span>
          </div>
          <input id="stream-growth" type="range" min="1" max="20" step="1" value="6" />
        </section>

        <section class="control-group" aria-labelledby="gravity-label">
          <div class="control-row">
            <label for="gravity" id="gravity-label">Gravity</label>
            <span class="value" id="gravity-value">0.10</span>
          </div>
          <input id="gravity" type="range" min="0.02" max="1" step="0.02" value="0.10" />
        </section>

        <div class="button-row">
          <button class="primary" id="clear-sand" type="button">Clear Sand</button>
          <button id="reset-settings" type="button">Reset Settings</button>
        </div>
      </aside>

      <section class="canvas-stage">
        <div id="canvas-host"></div>
      </section>
    </main>
  </body>
</html>
