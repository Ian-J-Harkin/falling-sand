<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Falling Sand Mobile</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="fallingsand.mobile.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #091018;
        --panel: rgba(7, 12, 19, 0.94);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #f7f7f3;
        --muted: #b6bec7;
        --accent: #f6a84f;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(246, 168, 79, 0.18), transparent 28%),
          linear-gradient(180deg, #0f1823 0%, var(--bg) 60%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        touch-action: manipulation;
      }

      body {
        min-height: 100vh;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .panel {
        padding: calc(18px + env(safe-area-inset-top)) 16px 16px;
        background: var(--panel);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--panel-border);
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
        line-height: 1;
      }

      .panel p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .control-group {
        display: grid;
        gap: 8px;
      }

      .control-group.wide {
        grid-column: 1 / -1;
      }

      .control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.92rem;
      }

      .value {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .button-row {
        display: flex;
        gap: 12px;
        grid-column: 1 / -1;
      }

      button {
        flex: 1;
        min-height: 48px;
        border: 0;
        border-radius: 16px;
        padding: 12px 14px;
        background: #202d3d;
        color: var(--text);
        font-size: 0.98rem;
      }

      button.primary {
        background: var(--accent);
        color: #231609;
      }

      .canvas-stage {
        display: grid;
        place-items: stretch;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      }

      #canvas-host {
        min-height: 0;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
      }

      canvas {
        display: block;
      }

      @media (max-width: 520px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <h1>Falling Sand</h1>
        <p>Touch and hold near the top to widen the stream. This mobile shell is the safe place for phone-specific work.</p>

        <div class="controls">
          <section class="control-group" aria-labelledby="brush-size-label">
            <div class="control-row">
              <label for="brush-size" id="brush-size-label">Max Width</label>
              <span class="value" id="brush-size-value">5</span>
            </div>
            <input id="brush-size" type="range" min="1" max="11" step="2" value="5" />
          </section>

          <section class="control-group" aria-labelledby="stream-growth-label">
            <div class="control-row">
              <label for="stream-growth" id="stream-growth-label">Widen Every</label>
              <span class="value" id="stream-growth-value">6f</span>
            </div>
            <input id="stream-growth" type="range" min="1" max="20" step="1" value="6" />
          </section>

          <section class="control-group wide" aria-labelledby="gravity-label">
            <div class="control-row">
              <label for="gravity" id="gravity-label">Gravity</label>
              <span class="value" id="gravity-value">0.10</span>
            </div>
            <input id="gravity" type="range" min="0.02" max="1" step="0.02" value="0.10" />
          </section>

          <div class="button-row">
            <button class="primary" id="clear-sand" type="button">Clear</button>
            <button id="reset-settings" type="button">Reset</button>
          </div>
        </div>
      </section>

      <section class="canvas-stage">
        <div id="canvas-host"></div>
      </section>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js");
        });
      }
    </script>
  </body>
</html>
